<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Planos de Aula{% endblock %}</title>
    
    <!-- CSS Custom & Bibliotecas -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/custom.css') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    
    {% block extra_css %}{% endblock %}
</head>
<body>
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            <div class="alerta-container" style="position: fixed; top: 20px; right: 20px; z-index: 9999; max-width: 420px; width: calc(100% - 40px);">
                {% for category, message in messages %}
                    <div class="alerta {{ category }}">
                        <span>{{ message }}</span>
                        <button type="button" class="alerta-fechar" onclick="this.parentElement.remove()">✕</button>
                    </div>
                {% endfor %}
            </div>
        {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        if (window.lucide) {
            lucide.createIcons();
        }
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
